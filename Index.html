<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GreenChat</title>
  <style>
    :root{--bg:#0a1a0f;--s:#132a18;--s2:#1a3a20;--p:#2ecc71;--t:#e8f5e9;--ts:#a5d6a7}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:var(--bg);display:flex;justify-content:center;align-items:center;height:100vh;color:var(--t)}
    .app{width:100%;max-width:420px;height:100vh;background:var(--s);display:flex;flex-direction:column}
    .h{background:var(--s2);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(46,204,113,.2)}
    .hi{font-size:22px}.hn{font-weight:700;font-size:16px}.on{font-size:12px;color:var(--ts);margin-left:auto}
    .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
    .msg{max-width:80%;padding:8px 14px;border-radius:18px;word-break:break-word;font-size:15px;line-height:1.4;animation:pop .25s ease}
    @keyframes pop{from{opacity:0;transform:scale(.95)}}
    .mine{align-self:flex-end;background:linear-gradient(135deg,#1b5e20,#2e7d32);border-bottom-right-radius:6px}
    .other{align-self:flex-start;background:linear-gradient(135deg,#1a3a20,#223d26);border-bottom-left-radius:6px}
    .sender{font-size:11px;font-weight:700;color:var(--p);margin-bottom:2px}
    .time{font-size:9px;opacity:.6;text-align:right;margin-top:2px}
    .inp{padding:8px 12px;background:var(--s2);display:flex;gap:8px;align-items:center}
    .inp input{flex:1;background:var(--s);border:1px solid rgba(46,204,113,.3);border-radius:20px;padding:10px 16px;color:var(--t);font-size:15px;outline:none}
    .btn{background:var(--p);color:#000;border:none;width:40px;height:40px;border-radius:50%;font-size:20px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .btn:active{transform:scale(.95)}
    .setup{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}
    .box{background:var(--s2);padding:24px;border-radius:20px;width:300px}
    .box input{width:100%;padding:12px;margin:12px 0;border-radius:12px;border:none;background:var(--s);color:var(--t);font-size:15px;outline:none}
    .box button{width:100%;padding:14px;background:var(--p);border:none;border-radius:25px;font-weight:bold;font-size:16px;cursor:pointer}
    .box p{font-size:12px;color:var(--ts);text-align:center;margin-top:10px}
  </style>
</head>
<body>
<div class="app">
  <div class="h"><span class="hi">💬</span><span class="hn">GreenChat</span><span class="on" id="status">ожидание</span></div>
  <div class="msgs" id="messages"></div>
  <div class="inp"><input id="msgInput" placeholder="Сообщение..." autocomplete="off"><button class="btn" id="sendBtn">➤</button></div>
</div>
<div class="setup" id="setup">
  <div class="box">
    <h3>🌿 Войти</h3>
    <input id="nameInput" placeholder="Ваше имя">
    <button id="joinBtn">Войти</button>
    <p>Отправьте другу ссылку на этот сайт.</p>
  </div>
</div>
<script>
(function() {
  const SERVER = window.location.origin; // автоматически берём адрес сервера
  const userId = 'u' + Math.random().toString(36).substr(2, 9);
  let userName = '';
  let lastId = null;
  const messagesDiv = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const status = document.getElementById('status');
  const setup = document.getElementById('setup');
  const nameInput = document.getElementById('nameInput');
  const joinBtn = document.getElementById('joinBtn');
  const rendered = new Set();

  function esc(t) {
    var d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  function render(msg) {
    if (rendered.has(msg.id)) return;
    rendered.add(msg.id);
    var div = document.createElement('div');
    div.className = 'msg ' + (msg.sender === userName ? 'mine' : 'other');
    var time = new Date(msg.timestamp).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
    div.innerHTML =
      (msg.sender !== userName ? '<div class="sender">'+esc(msg.sender)+'</div>' : '') +
      '<span>'+esc(msg.text)+'</span>' +
      '<div class="time">'+time+'</div>';
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function system(text) {
    var div = document.createElement('div');
    div.className = 'msg other';
    div.style.cssText = 'align-self:center;background:rgba(46,204,113,.15);max-width:90%;text-align:center;font-size:13px;';
    div.innerHTML = '<span>'+esc(text)+'</span>';
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function fetchMessages() {
    try {
      const res = await fetch(SERVER + '/messages');
      if (!res.ok) throw new Error('fail');
      const messages = await res.json();
      if (messages.length > 0) {
        const latest = messages[messages.length - 1].id;
        if (latest !== lastId) {
          lastId = latest;
          messages.forEach(m => render(m));
        }
      }
      status.textContent = 'онлайн';
    } catch(e) {
      status.textContent = 'ошибка';
    }
  }

  async function sendMessage() {
    var text = msgInput.value.trim();
    if (!text || !userName) return;
    try {
      await fetch(SERVER + '/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, sender: userName })
      });
      msgInput.value = '';
      msgInput.focus();
      fetchMessages();
    } catch(e) {
      system('❌ Ошибка отправки');
    }
  }

  joinBtn.addEventListener('click', function() {
    var name = nameInput.value.trim();
    if (!name) { alert('Введите имя'); return; }
    userName = name;
    localStorage.setItem('greenchat_name', name);
    setup.style.display = 'none';
    system('✅ Вы вошли как ' + esc(name));
    fetchMessages();
    setInterval(fetchMessages, 2000);
  });

  const savedName = localStorage.getItem('greenchat_name');
  if (savedName) nameInput.value = savedName;

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
})();
</script>
</body>
</html>
